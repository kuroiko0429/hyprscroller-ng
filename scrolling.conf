# =============================================
# hyprscrolling plugin configuration example
# =============================================
# Load this file from hyprland.conf:
#   source = /path/to/hyprscrolling/scrolling.en.conf
#
# Load the plugin:
#   plugin = /path/to/hyprscrolling/hyprscrolling.so

# Set layout to hyprscrolling
general {
    layout = hyprscrolling
}

# =============================================
# Plugin settings
# =============================================
plugin {
    hyprscrolling {
        # If there is only one column, make it fullscreen
        fullscreen_on_one_column = false

        # Default column width as a fraction of monitor width (0.1 ~ 1.0)
        column_width = 0.5

        # How to bring a focused column into view (0 = center, 1 = fit into view)
        focus_fit_method = 0

        # Automatically scroll to keep the focused column visible
        follow_focus = true

        # Debounce time (ms) for follow_focus events
        follow_debounce_ms = 0

        # Preset widths to cycle through with +conf / -conf
        explicit_column_widths = 0.333, 0.5, 0.667, 1.0

        # Width of a collapsed column in pixels
        collapsed_width = 30

        # Enable / disable focus history (true = enabled, false = disabled)
        focus_history = true

        # Automatic column width per window class (class:width, comma-separated)
        # auto_width_rules = firefox:0.7, kitty:0.3, code-oss:0.6, discord:0.25
        auto_width_rules =
    }
}

# =============================================
# Keybindings - Focus movement
# =============================================
bind = SUPER, H, layoutmsg, focus l
bind = SUPER, L, layoutmsg, focus r
bind = SUPER, K, layoutmsg, focus u
bind = SUPER, J, layoutmsg, focus d

# Cycle through windows with mouse wheel
bind = SUPER CTRL, mouse_down, cyclenext
bind = SUPER CTRL, mouse_up, cyclenext, prev

# =============================================
# Keybindings - Window movement
# =============================================
# Move window into an adjacent column/stack
bind = SUPER SHIFT, H, layoutmsg, movewindowto l
bind = SUPER SHIFT, L, layoutmsg, movewindowto r
bind = SUPER SHIFT, K, layoutmsg, movewindowto u
bind = SUPER SHIFT, J, layoutmsg, movewindowto d

# Promote window to its own new column
bind = SUPER, P, layoutmsg, promote

# =============================================
# Keybindings - Column operations
# =============================================
# Swap column with its neighbor
bind = SUPER ALT, H, layoutmsg, swapcol l
bind = SUPER ALT, L, layoutmsg, swapcol r

# Resize column (relative)
bind = SUPER, equal, layoutmsg, colresize +0.05
bind = SUPER, minus, layoutmsg, colresize -0.05

# Cycle through preset column widths
bind = SUPER, bracketright, layoutmsg, colresize +conf
bind = SUPER, bracketleft, layoutmsg, colresize -conf

# Reset all columns to equal width
bind = SUPER SHIFT, equal, layoutmsg, colresize all 0.5

# =============================================
# Keybindings - View scrolling
# =============================================
# Scroll by column
bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma, layoutmsg, move -col

# Scroll by pixels
bind = SUPER SHIFT, period, layoutmsg, move +200
bind = SUPER SHIFT, comma, layoutmsg, move -200

# =============================================
# Keybindings - Fit operations
# =============================================
# Fit active column to screen
bind = SUPER, F, layoutmsg, fit active

# Fit all visible columns to screen
bind = SUPER SHIFT, F, layoutmsg, fit visible

# Fit all columns to screen
bind = SUPER CTRL, F, layoutmsg, fit all

# Toggle fit method (center <-> fit)
bind = SUPER, T, layoutmsg, togglefit

# =============================================
# Keybindings - Column pinning
# =============================================
# Pin column to left screen edge (stays fixed while scrolling)
bind = SUPER CTRL, bracketleft, layoutmsg, pin left

# Pin column to right screen edge
bind = SUPER CTRL, bracketright, layoutmsg, pin right

# Remove pin from current column
bind = SUPER CTRL, backslash, layoutmsg, unpin

# =============================================
# Keybindings - Column workspace movement
# =============================================
# Move entire column to a specific workspace
bind = SUPER CTRL SHIFT, 1, layoutmsg, movecoltoworkspace 1
bind = SUPER CTRL SHIFT, 2, layoutmsg, movecoltoworkspace 2
bind = SUPER CTRL SHIFT, 3, layoutmsg, movecoltoworkspace 3
bind = SUPER CTRL SHIFT, 4, layoutmsg, movecoltoworkspace 4
bind = SUPER CTRL SHIFT, 5, layoutmsg, movecoltoworkspace 5

# Move entire column to adjacent workspace
bind = SUPER CTRL SHIFT, right, layoutmsg, movecoltoworkspace +1
bind = SUPER CTRL SHIFT, left, layoutmsg, movecoltoworkspace -1

# Move entire column to special workspace
bind = SUPER CTRL SHIFT, S, layoutmsg, movecoltoworkspace special

# =============================================
# Keybindings - Column collapse
# =============================================
# Toggle fold / expand current column
bind = SUPER, C, layoutmsg, togglecollapse

# =============================================
# Keybindings - Zen mode
# =============================================
# Show only the focused column (focus mode)
bind = SUPER, Z, layoutmsg, zen

# =============================================
# Keybindings - Focus history
# =============================================
# Go back to previously focused window
bind = SUPER ALT, bracketleft, layoutmsg, focusback

# Go forward in focus history
bind = SUPER ALT, bracketright, layoutmsg, focusfwd
